<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Draw Battle 🎨</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 20% 0%,#243b6b 0%,#141a35 45%,#0a0e1f 100%);
    color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:14px;overflow-x:hidden;}
  .screen{display:none;width:100%;max-width:700px;animation:fade .3s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:22px;padding:26px 22px;backdrop-filter:blur(12px);
    box-shadow:0 20px 50px rgba(0,0,0,.5);}
  h1{font-size:2.1rem;text-align:center;margin-bottom:6px;
     background:linear-gradient(90deg,#ffb347,#ff5f6d,#a06bff,#41d8ff);
     -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  .sub{text-align:center;opacity:.6;font-size:.86rem;margin-bottom:24px}
  button{font-family:inherit;font-size:1rem;font-weight:600;border:none;border-radius:14px;
    padding:15px 18px;cursor:pointer;width:100%;margin-bottom:12px;color:#fff;
    background:linear-gradient(135deg,#4f6cff,#8b5cf6);transition:.18s;
    box-shadow:0 6px 18px rgba(79,108,255,.35);}
  button:hover{transform:translateY(-2px);filter:brightness(1.1)}
  button:active{transform:scale(.97)}
  button.ghost{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.16)}
  button.green{background:linear-gradient(135deg,#16b981,#0ea5a5);box-shadow:0 6px 18px rgba(16,185,129,.35)}
  button.orange{background:linear-gradient(135deg,#f59e0b,#ea580c);box-shadow:0 6px 18px rgba(245,158,11,.35)}
  button.small{width:auto;padding:9px 16px;font-size:.85rem;margin:0}
  input{width:100%;padding:15px;border-radius:14px;border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.25);color:#fff;font-size:1.25rem;text-align:center;
    letter-spacing:.35em;text-transform:uppercase;font-weight:700;margin-bottom:12px;
    font-family:inherit;outline:none;}
  input:focus{border-color:#7c8cff;box-shadow:0 0 0 3px rgba(124,140,255,.25)}
  input::placeholder{letter-spacing:normal;font-weight:400;font-size:.95rem;text-transform:none}
  .code-box{background:rgba(0,0,0,.35);border:2px dashed rgba(255,255,255,.3);
    border-radius:16px;padding:18px;text-align:center;margin:16px 0;}
  .code-box .lbl{font-size:.75rem;letter-spacing:.2em;opacity:.55;text-transform:uppercase}
  .code-box .val{font-size:2.6rem;font-weight:800;letter-spacing:.18em;color:#7cf3d0;
                 text-shadow:0 0 22px rgba(124,243,208,.5);margin-top:4px}
  .status{text-align:center;font-size:.9rem;opacity:.75;margin-top:12px;min-height:20px}
  .status.err{color:#ff7a7a;opacity:1}
  .player-count{text-align:center;font-size:1.2rem;font-weight:700;margin:12px 0;color:#7cf3d0}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .prompt-chip{flex:1;display:flex;align-items:center;gap:12px;
    background:linear-gradient(135deg,#ff5f6d,#a06bff);
    border-radius:14px;padding:10px 14px;font-weight:700;
    box-shadow:0 6px 20px rgba(160,107,255,.35);}
  .prompt-chip .txt{flex:1;text-align:left}
  .prompt-chip small{display:block;font-size:.6rem;opacity:.85;letter-spacing:.15em;font-weight:500;margin-bottom:2px}
  .prompt-chip .word{font-size:1.15rem;line-height:1.1}
  .prompt-chip .emoji{font-size:2.4rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
  .timer{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;
    font-size:1.1rem;font-weight:800;flex-shrink:0;
    background:conic-gradient(#41d8ff var(--p,100%),rgba(255,255,255,.1) 0);position:relative;}
  .timer::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#151a30}
  .timer span{position:relative;z-index:1}
  .timer.danger{animation:pulse .6s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .canvas-wrap{position:relative;border-radius:18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.15)}
  canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;background:#fff;
         touch-action:none;cursor:crosshair}
  canvas.bucket-mode{cursor:cell}
  .colors{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px;
    background:rgba(0,0,0,.25);padding:8px;border-radius:14px;}
  .color{aspect-ratio:1/1;border-radius:10px;cursor:pointer;
    border:3px solid transparent;transition:.15s;position:relative;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);}
  .color:hover{transform:scale(1.08)}
  .color.sel{border-color:#fff;transform:scale(1.1);box-shadow:0 0 12px rgba(255,255,255,.5)}
  .color.sel::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-weight:900;font-size:.85rem;text-shadow:0 0 4px #000;}
  .custom-color{
    background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red) !important;
    display:grid;place-items:center;position:relative;overflow:hidden;
  }
  .custom-color span{font-size:1.2rem;font-weight:900;color:#fff;
    text-shadow:0 0 6px #000,0 0 3px #000;pointer-events:none;position:relative;z-index:1;}
  .custom-color input{position:absolute;inset:0;width:100%;height:100%;
    opacity:0;cursor:pointer;border:none;padding:0;margin:0;letter-spacing:0;text-transform:none;}
  .custom-color.sel::after{content:'✓' !important;z-index:2;}
  .tools-row{display:flex;gap:8px;align-items:center;margin-top:8px;justify-content:center;flex-wrap:wrap}
  .tool{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);
    border:2px solid transparent;display:grid;place-items:center;cursor:pointer;
    transition:.15s;font-size:1.15rem;user-select:none;}
  .tool:hover{background:rgba(255,255,255,.18)}
  .tool.sel{border-color:#7c8cff;background:rgba(124,140,255,.3)}
  .tool .dot{background:#fff;border-radius:50%}
  .tool.clear{width:auto;padding:0 16px;font-size:.85rem;font-weight:600;color:#fff;gap:6px}
  .tool.eraser.sel{border-color:#fbbf24;background:rgba(251,191,36,.25)}
  .tool.bucket.sel{border-color:#41d8ff;background:rgba(65,216,255,.25)}
  .tool.undo,.tool.redo{font-weight:900;font-size:1.3rem}
  .tool.disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
  .ref-box{display:flex;flex-direction:column;align-items:center;
    background:rgba(0,0,0,.3);border-radius:16px;padding:14px;margin-bottom:16px;
    border:1px solid rgba(255,255,255,.12);}
  .ref-box .ref-emoji{font-size:4rem;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
  .ref-box .ref-label{font-size:.7rem;letter-spacing:.2em;opacity:.6;text-transform:uppercase;margin-top:4px}
  .ref-box .ref-word{font-size:1.3rem;font-weight:800;margin-top:2px}
  .winner{text-align:center;font-size:1.6rem;font-weight:900;margin:6px 0 14px;
    padding:12px;border-radius:14px;letter-spacing:.02em;}
  .winner.win{background:linear-gradient(135deg,#16b981,#0ea5a5);box-shadow:0 8px 24px rgba(16,185,129,.4)}
  .winner.lose{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 8px 24px rgba(239,68,68,.4)}
  .winner.tie{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 8px 24px rgba(245,158,11,.4)}
  .compare{display:grid;gap:10px;margin-bottom:16px}
  .compare .item{background:rgba(0,0,0,.3);border-radius:14px;padding:8px;
    border:1px solid rgba(255,255,255,.1);text-align:center;}
  .compare .item h4{font-size:.68rem;opacity:.7;margin-bottom:6px;
                    letter-spacing:.1em;text-transform:uppercase;font-weight:600;
                    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .compare img{width:100%;border-radius:8px;background:#fff;display:block;
               aspect-ratio:1/1;object-fit:contain}
  .compare .pct{font-size:1.6rem;font-weight:900;margin-top:6px;line-height:1;
    background:linear-gradient(90deg,#41d8ff,#a06bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .compare .item.winner-col .pct{background:linear-gradient(90deg,#fbbf24,#f59e0b);
    -webkit-background-clip:text;background-clip:text;}
  .compare .item.winner-col{border-color:rgba(251,191,36,.6);box-shadow:0 0 20px rgba(251,191,36,.2)}
  .compare .item.me h4{color:#7cf3d0}
  .verdict{text-align:center;font-size:.95rem;font-weight:600;margin-bottom:16px;opacity:.85;min-height:22px}
  .spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.15);
    border-top-color:#7c8cff;border-radius:50%;animation:spin 1s linear infinite;margin:18px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .players-list{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .player-pill{background:rgba(124,243,208,.15);border:1px solid rgba(124,243,208,.4);
    border-radius:20px;padding:6px 14px;font-size:.82rem;font-weight:600;color:#7cf3d0}
</style>
</head>
<body>

<!-- ============ MENU ============ -->
<div id="menu" class="screen active">
  <div class="card">
    <h1>🎨 Draw Battle</h1>
    <p class="sub">Adu gambar! Siapa yang paling mirip dengan topiknya?</p>
    <button onclick="createRoom(2)">🎯 Buat Room 1 vs 1</button>
    <button class="orange" onclick="createRoom(3)">👥 Buat Room 3 Pemain</button>
    <button class="ghost" onclick="toggleJoin()">🔑 Gabung Room</button>
    <div id="joinBox" style="display:none;margin-top:6px">
      <input id="joinCode" placeholder="Masukkan kode room" maxlength="6"
             autocomplete="off" oninput="this.value=this.value.toUpperCase()">
      <button class="green" onclick="joinRoom()">🚀 Gabung</button>
    </div>
    <div id="menuStatus" class="status"></div>
  </div>
</div>

<!-- ============ LOBBY ============ -->
<div id="lobby" class="screen">
  <div class="card">
    <h1 style="font-size:1.5rem">Room Dibuat!</h1>
    <p class="sub">Bagikan kode ini ke temanmu</p>
    <div class="code-box">
      <div class="lbl">Kode Room</div>
      <div class="val" id="roomCodeDisplay">------</div>
    </div>
    <button class="ghost small" style="width:100%" onclick="copyCode()">📋 Salin Kode</button>
    <div class="player-count" id="playerCount">👥 1 / 2</div>
    <div class="players-list" id="playersList"></div>
    <div class="spinner"></div>
    <div id="lobbyStatus" class="status">Menunggu pemain...</div>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game" class="screen">
  <div class="topbar">
    <div class="prompt-chip">
      <div class="txt">
        <small>TEMA GAMBAR</small>
        <div class="word" id="promptText">-</div>
      </div>
      <div class="emoji" id="promptEmoji">🎨</div>
    </div>
    <div class="timer" id="timerEl"><span id="timerNum">3:00</span></div>
  </div>
  <div class="canvas-wrap"><canvas id="canvas" width="600" height="600"></canvas></div>
  <div class="colors" id="colorsRow">
    <div class="color sel" data-color="#111111" style="background:#111111"></div>
    <div class="color" data-color="#ef4444" style="background:#ef4444"></div>
    <div class="color" data-color="#f97316" style="background:#f97316"></div>
    <div class="color" data-color="#facc15" style="background:#facc15"></div>
    <div class="color" data-color="#22c55e" style="background:#22c55e"></div>
    <div class="color" data-color="#3b82f6" style="background:#3b82f6"></div>
    <div class="color" data-color="#8b5cf6" style="background:#8b5cf6"></div>
    <div class="color" data-color="#ec4899" style="background:#ec4899"></div>
    <div class="color" data-color="#a16207" style="background:#a16207"></div>
    <div class="color" data-color="#ffffff" style="background:#ffffff"></div>
    <div class="color" data-color="#94a3b8" style="background:#94a3b8"></div>
    <div class="color" data-color="#78350f" style="background:#78350f"></div>
    <div class="color" data-color="#0ea5e9" style="background:#0ea5e9"></div>
    <div class="color" data-color="#14b8a6" style="background:#14b8a6"></div>
    <div class="color" data-color="#f43f5e" style="background:#f43f5e"></div>
    <div class="color" data-color="#a855f7" style="background:#a855f7"></div>
    <div class="color" data-color="#84cc16" style="background:#84cc16"></div>
    <div class="color" data-color="#fb923c" style="background:#fb923c"></div>
    <div class="color" data-color="#1e293b" style="background:#1e293b"></div>
    <label class="color custom-color" id="customColorBtn" title="Pilih warna sendiri">
      <input type="color" id="customColorInput" value="#111111">
      <span>+</span>
    </label>
  </div>
  <div class="tools-row">
    <div class="tool undo disabled" id="undoBtn" onclick="undo()" title="Undo">↶</div>
    <div class="tool redo disabled" id="redoBtn" onclick="redo()" title="Redo">↷</div>
    <div class="tool sel" data-size="3"><div class="dot" style="width:5px;height:5px"></div></div>
    <div class="tool" data-size="9"><div class="dot" style="width:11px;height:11px"></div></div>
    <div class="tool" data-size="20"><div class="dot" style="width:20px;height:20px"></div></div>
    <div class="tool eraser" id="eraserBtn" onclick="toggleEraser()" title="Penghapus">🩹</div>
    <div class="tool bucket" id="bucketBtn" onclick="toggleBucket()" title="Isi Warna">🪣</div>
    <div class="tool clear" onclick="clearCanvas()">🗑 Hapus</div>
  </div>
  <button class="green" style="margin-top:14px" onclick="submitDrawing()">✅ Selesai &amp; Kirim</button>
</div>

<!-- ============ WAITING ============ -->
<div id="waiting" class="screen">
  <div class="card" style="text-align:center">
    <h1 style="font-size:1.4rem">Gambarmu Terkirim! 📤</h1>
    <p class="sub">Menunggu pemain lain menyelesaikan gambarnya...</p>
    <div class="spinner"></div>
    <div class="status" id="waitStatus">Sabarrr...</div>
    <div class="players-list" id="waitPlayersList"></div>
  </div>
</div>

<!-- ============ RESULT ============ -->
<div id="result" class="screen">
  <div class="card">
    <div class="ref-box">
      <div class="ref-emoji" id="refEmoji">🎨</div>
      <div class="ref-label">Topik</div>
      <div class="ref-word" id="refWord">-</div>
    </div>
    <div class="winner" id="winnerBox">-</div>
    <div class="compare" id="compare"></div>
    <div class="verdict" id="verdict"></div>
    <button onclick="playAgain()">🔄 Main Lagi</button>
    <div class="status" id="resultStatus"></div>
  </div>
</div>

/* ================== UTIL ================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}
function randomTopic(){ return TOPICS[Math.floor(Math.random()*TOPICS.length)]; }
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function setStatus(el,msg,err){
  const e=$(el); e.textContent=msg; e.classList.toggle('err',!!err);
}

/* ================== RENDER EMOJI → GRID ================== */
function renderEmojiGrid(emoji){
  const c = document.createElement('canvas');
  c.width = GRID; c.height = GRID;
  const cx = c.getContext('2d', {willReadFrequently:true});
  cx.fillStyle = '#ffffff';
  cx.fillRect(0, 0, GRID, GRID);
  cx.font = `${Math.floor(GRID*0.58)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color",sans-serif`;
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText(emoji, GRID/2, GRID/2 + GRID*0.02);

  const d = cx.getImageData(0,0,GRID,GRID).data;
  const arr = new Uint8Array(GRID*GRID);
  for (let i=0, j=0; i<d.length; i+=4, j++){
    const dist = Math.abs(255-d[i]) + Math.abs(255-d[i+1]) + Math.abs(255-d[i+2]);
    arr[j] = dist > 100 ? 1 : 0;
  }
  return arr;
}

/* ================== ROOM (HOST) ================== */
let hostRetry = 0;
function createRoom(mode){
  isHost = true;
  hostRetry = 0;
  maxPlayers = mode;
  myId = 'host';
  peerConns = [];
  playersData = {};
  openHost();
}

function openHost(){
  roomCode = genCode();
  setStatus('menuStatus','Membuat room...');
  try { if (peer) peer.destroy(); } catch(_){}
  peer = new Peer('dbattle-'+roomCode, PEER_CONFIG);

  peer.on('open', ()=>{
    setStatus('menuStatus','');
    showScreen('lobby');
    $('roomCodeDisplay').textContent = roomCode;
    updateLobby();
  });

  peer.on('connection', c=>{
    if (peerConns.length + 1 >= maxPlayers){
      // Room penuh
      c.on('open', ()=>{ c.send({type:'full'}); setTimeout(()=>c.close(), 500); });
      return;
    }
    peerConns.push(c);
    setupHostConn(c);
  });

  peer.on('error', e=>{
    console.error('Host error:', e);
    if (e.type==='unavailable-id' && hostRetry<5){
      hostRetry++;
      try{ peer.destroy(); }catch(_){}
      openHost();
    } else if (e.type==='network'){
      setStatus('menuStatus','Jaringan bermasalah.', true);
    } else {
      setStatus('menuStatus','Gagal membuat room: '+e.type, true);
    }
  });

  peer.on('disconnected', () => {
    try { peer.reconnect(); } catch(_){}
  });
}

function setupHostConn(c){
  c.on('open', ()=>{
    console.log('Client connected:', c.peer);
    updateLobby();
    // Kalau udah full → mulai game
    if (peerConns.length + 1 === maxPlayers){
      setTimeout(startGameHost, 500);
    }
  });

  c.on('data', data=>{
    if (!data) return;
    if (data.type === 'submit'){
      // Client submit gambar
      playersData[c.peer] = { grid: data.grid, img: data.img };
      // Relay ke semua client lain
      peerConns.forEach(pc => {
        if (pc !== c && pc.open){
          try { pc.send({type:'update', playerId: c.peer, grid: data.grid, img: data.img}); } catch(_){}
        }
      });
      broadcastWaiting();
      checkAllSubmitted();
    }
    else if (data.type === 'rematch'){
      if (!gameActive) playAgainHost();
    }
  });

  c.on('close', ()=>{
    console.log('Client disconnected:', c.peer);
    if (gameActive){
      alert('Pemain terputus 😢 Game dibatalkan.');
      location.reload();
    } else {
      // Buang dari array
      peerConns = peerConns.filter(x => x !== c);
      updateLobby();
    }
  });

  c.on('error', e => console.error('Conn error:', e));
}

function updateLobby(){
  const count = peerConns.length + 1;
  $('playerCount').textContent = `👥 ${count} / ${maxPlayers}`;
  const list = $('playersList');
  list.innerHTML = '';
  const names = ['🎨 Kamu (Host)'];
  peerConns.forEach((c, i) => names.push(`🎨 Pemain ${i+2}`));
  names.forEach(n => {
    const d = document.createElement('div');
    d.className = 'player-pill';
    d.textContent = n;
    list.appendChild(d);
  });
  if (count < maxPlayers){
    setStatus('lobbyStatus', `Menunggu pemain (${count}/${maxPlayers})...`);
  } else {
    setStatus('lobbyStatus', 'Semua siap! Memulai game...');
  }
  // Beritahu client jumlah pemain
  peerConns.forEach(pc => {
    if (pc.open) try { pc.send({type:'lobby', count, max: maxPlayers}); } catch(_){}
  });
}

function startGameHost(){
  playerIds = ['host', ...peerConns.map(c => c.peer)];
  const t = randomTopic();
  const rg = renderEmojiGrid(t.emoji);
  const refStr = packGrid(rg);

  peerConns.forEach(pc => {
    if (pc.open) try {
      pc.send({
        type:'start',
        word: t.word,
        emoji: t.emoji,
        refGrid: refStr,
        playerIds: playerIds
      });
    } catch(_){}
  });

  startGame(t.word, t.emoji, rg, playerIds);
}

function playAgainHost(){
  // Reset playersData
  playersData = {};
  playerIds = ['host', ...peerConns.map(c => c.peer)];
  const t = randomTopic();
  const rg = renderEmojiGrid(t.emoji);
  const refStr = packGrid(rg);
  peerConns.forEach(pc => {
    if (pc.open) try {
      pc.send({type:'start', word:t.word, emoji:t.emoji, refGrid:refStr, playerIds});
    } catch(_){}
  });
  startGame(t.word, t.emoji, rg, playerIds);
}

/* ================== ROOM (CLIENT) ================== */
function toggleJoin(){
  const b=$('joinBox');
  b.style.display = b.style.display==='none'?'block':'none';
  if (b.style.display==='block') $('joinCode').focus();
}

function joinRoom(){
  const code = $('joinCode').value.trim().toUpperCase();
  if (code.length!==6){ setStatus('menuStatus','Kode harus 6 karakter!',true); return; }
  roomCode = code;
  isHost = false;
  peerConns = [];
  playersData = {};
  setStatus('menuStatus','Menghubungkan ke room...');

  try { if (peer) peer.destroy(); } catch(_){}
  peer = new Peer(PEER_CONFIG);

  peer.on('open', ()=>{
    myId = peer.id;
    setStatus('menuStatus','Mencari host...');
    const conn = peer.connect('dbattle-'+code, { reliable: true });
    peerConns = [conn];

    clearTimeout(connectTimeout);
    connectTimeout = setTimeout(()=>{
      if (!conn.open){
        setStatus('menuStatus','Gagal terhubung (timeout). Cek kode / jaringan.', true);
        try { conn.close(); peer.destroy(); } catch(_){}
      }
    }, 20000);

    conn.on('open', ()=>{
      clearTimeout(connectTimeout);
      setStatus('menuStatus','Terhubung! Menunggu host...');
      showScreen('lobby');
      $('roomCodeDisplay').textContent = code;
      setStatus('lobbyStatus','Menunggu host memulai...');
      $('playerCount').textContent = '👥 ? / ?';
      updateClientPlayersList(['🎨 Kamu']);
    });

    conn.on('data', handleData);
    conn.on('close', ()=>{
      if (gameActive || $('lobby').classList.contains('active')){
        alert('Host terputus 😢');
        location.reload();
      }
    });
    conn.on('error', e => console.error('Conn error:', e));
  });

  peer.on('error', e=>{
    console.error('Join error:', e);
    clearTimeout(connectTimeout);
    if (e.type==='peer-unavailable') setStatus('menuStatus','Room tidak ditemukan 😢',true);
    else if (e.type==='network') setStatus('menuStatus','Jaringan bermasalah.',true);
    else setStatus('menuStatus','Error: '+e.type, true);
  });

  peer.on('disconnected', () => {
    try { peer.reconnect(); } catch(_){}
  });
}

function updateClientPlayersList(names){
  const list = $('playersList');
  list.innerHTML = '';
  names.forEach(n => {
    const d = document.createElement('div');
    d.className = 'player-pill';
    d.textContent = n;
    list.appendChild(d);
  });
}

/* ================== HANDLE DATA ================== */
function handleData(data){
  if (!data) return;
  if (data.type === 'full'){
    setStatus('menuStatus','Room sudah penuh! 😢', true);
    try { peerConns[0].close(); peer.destroy(); } catch(_){}
    return;
  }
  if (data.type === 'lobby'){
    $('playerCount').textContent = `👥 ${data.count} / ${data.max}`;
    const names = [];
    // Kita nggak tau pasti siapa yang join, jadi pake placeholder
    for (let i = 0; i < data.count; i++){
      names.push(i === 0 ? '🎨 Host' : `🎨 Pemain ${i+1}`);
    }
    // Ganti diri sendiri
    const myIdx = 1; // asumsi client selalu player #2 atau #3
    if (names[1]) names[1] = '🎨 Kamu';
    updateClientPlayersList(names);
    setStatus('lobbyStatus', `Menunggu pemain (${data.count}/${data.max})...`);
  }
  if (data.type === 'start'){
    clearTimeout(connectTimeout);
    playerIds = data.playerIds || [];
    refGrid = unpackGrid(data.refGrid);
    startGame(data.word, data.emoji, refGrid, playerIds);
  }
  if (data.type === 'update'){
    playersData[data.playerId] = { grid: data.grid, img: data.img };
    updateWaitingList();
    checkAllSubmitted();
  }
}

/* ================== GAME FLOW ================== */
function startGame(word, emoji, rg, pIds){
  promptTopic = {word, emoji};
  refGrid = rg;
  if (pIds) playerIds = pIds;
  playersData = {};
  resultShown = false;
  clearTimeout(connectTimeout);

  $('promptText').textContent = word;
  $('promptEmoji').textContent = emoji;
  $('refEmoji').textContent = emoji;
  $('refWord').textContent = word;
  $('compare').innerHTML = '';
  $('winnerBox').textContent = '-';
  $('winnerBox').className = 'winner';
  $('verdict').textContent = '';
  setStatus('resultStatus','');

  // Reset tools
  currentColor = '#111111'; isEraser = false; isBucket = false;
  document.querySelectorAll('.color').forEach(x=>x.classList.toggle('sel', x.dataset.color==='#111111'));
  $('eraserBtn').classList.remove('sel');
  $('bucketBtn').classList.remove('sel');
  canvas.classList.remove('bucket-mode');
  $('customColorBtn').classList.remove('sel');
  $('customColorBtn').style.background = '';
  $('customColorInput').value = '#111111';

  clearCanvas(false);
  showScreen('game');

  history = [];
  historyIndex = -1;
  pushHistory();

  gameActive = true;
  timeLeft = DRAW_TIME;
  updateTimerUI();
  clearInterval(timerId);
  timerId = setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) submitDrawing();
  }, 1000);
}

function updateTimerUI(){
  const t = Math.max(0, timeLeft);
  const m = Math.floor(t/60);
  const s = t%60;
  $('timerNum').textContent = m + ':' + String(s).padStart(2,'0');
  const pct = (timeLeft / DRAW_TIME) * 100;
  const el = $('timerEl');
  el.style.setProperty('--p', pct+'%');
  el.classList.toggle('danger', timeLeft <= 20);
}

function submitDrawing(){
  if (!gameActive) return;
  gameActive = false;
  clearInterval(timerId);

  const myGrid = toGrid(canvas);
  const myImg  = canvasToThumb(canvas, 320);
  const myGridStr = packGrid(myGrid);

  // Simpan punya sendiri
  playersData[myId] = { grid: myGridStr, img: myImg };

  if (isHost){
    // Broadcast ke semua client
    peerConns.forEach(pc => {
      if (pc.open) try {
        pc.send({type:'update', playerId: myId, grid: myGridStr, img: myImg});
      } catch(_){}
    });
  } else {
    // Kirim ke host
    if (peerConns[0] && peerConns[0].open){
      try { peerConns[0].send({type:'submit', grid: myGridStr, img: myImg}); } catch(_){}
    }
  }

  showScreen('waiting');
  setStatus('waitStatus','Menunggu pemain lain menyelesaikan gambarnya...');
  updateWaitingList();
  checkAllSubmitted();
}

function updateWaitingList(){
  const list = $('waitPlayersList');
  if (!list) return;
  list.innerHTML = '';
  playerIds.forEach(id => {
    const done = !!playersData[id];
    const label = getPlayerLabel(id);
    const d = document.createElement('div');
    d.className = 'player-pill';
    d.style.opacity = done ? 1 : 0.4;
    d.textContent = (done ? '✅ ' : '⏳ ') + label;
    list.appendChild(d);
  });
}

function broadcastWaiting(){
  // Host: kabari semua client siapa yang udah selesai
  // (simple: client update lewat 'update' data yang di-relay)
  // Tidak perlu action tambahan
}

function checkAllSubmitted(){
  if (resultShown) return;
  if (playerIds.length === 0) return;
  // Cek apakah semua pemain udah submit
  for (const id of playerIds){
    if (!playersData[id]) return;
  }
  resultShown = true;
  // Hitung skor tiap pemain
  const scores = playerIds.map(id => {
    const gridArr = unpackGrid(playersData[id].grid);
    return { id, score: similarity(gridArr, refGrid) };
  });
  showResult(scores);
}

function getPlayerLabel(id){
  if (id === myId) return 'Kamu';
  if (playerIds.length === 2) return 'Lawan';
  if (id === 'host') return 'Host';
  const idx = playerIds.indexOf(id);
  return 'Pemain ' + (idx + 1);
}

function showResult(scores){
  showScreen('result');

  const sorted = [...scores].sort((a,b) => b.score - a.score);
  const maxScore = sorted[0].score;
  const winners = sorted.filter(s => s.score === maxScore);

  // Render compare dinamis
  const cmp = $('compare');
  cmp.innerHTML = '';
  cmp.style.gridTemplateColumns = `repeat(${scores.length}, 1fr)`;

  scores.forEach(s => {
    const el = document.createElement('div');
    el.className = 'item';
    if (s.id === myId) el.classList.add('me');
    if (s.id === winners[0].id && winners.length === 1) el.classList.add('winner-col');
    const label = getPlayerLabel(s.id);
    const img = playersData[s.id].img || '';
    el.innerHTML = `
      <h4>${label}</h4>
      <img src="${img}" alt="${label}">
      <div class="pct">${s.score}%</div>
    `;
    cmp.appendChild(el);
  });

  // Winner box
  const box = $('winnerBox');
  if (winners.length > 1){
    box.textContent = '🤝 SERI!';
    box.className = 'winner tie';
  } else if (winners[0].id === myId){
    box.textContent = '🏆 KAMU MENANG!';
    box.className = 'winner win';
  } else {
    box.textContent = `😢 ${getPlayerLabel(winners[0].id).toUpperCase()} MENANG`;
    box.className = 'winner lose';
  }

  // Verdict
  const myScore = scores.find(s => s.id === myId).score;
  const diff = myScore - maxScore;
  let v = '';
  if (winners.length > 1) v = '🔥 Skornya sama kuat!';
  else if (diff === 0) v = '🎯 Gambarmu paling mirip dengan topiknya!';
  else if (diff >= -5) v = '😱 Ketat banget, beda tipis!';
  else if (diff >= -15) v = '😮 Lumayan deket nih!';
  else if (diff >= -30) v = '😅 Masih ada selisih...';
  else v = '😵 Jauh banget, latihan lagi ya!';
  $('verdict').textContent = v;
}

function playAgain(){
  if (isHost){
    playAgainHost();
  } else {
    if (peerConns[0] && peerConns[0].open){
      try { peerConns[0].send({type:'rematch'}); } catch(_){}
    }
    setStatus('resultStatus','Menunggu host memulai ulang...');
  }
}

/* ================== DRAWING ================== */
const canvas = $('canvas');
const ctx = canvas.getContext('2d', {willReadFrequently:true});
let drawing=false, lastPt=null;

function snapshot(){ return canvas.toDataURL('image/png'); }

function pushHistory(){
  if (isRestoring) return;
  history = history.slice(0, historyIndex + 1);
  history.push(snapshot());
  if (history.length > MAX_HISTORY) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedoUI();
}

function restoreFromHistory(){
  if (historyIndex < 0 || historyIndex >= history.length) return;
  isRestoring = true;
  const dataURL = history[historyIndex];
  const img = new Image();
  img.onload = ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0);
    isRestoring = false;
  };
  img.src = dataURL;
  updateUndoRedoUI();
}

function undo(){ if (historyIndex <= 0) return; historyIndex--; restoreFromHistory(); }
function redo(){ if (historyIndex >= history.length-1) return; historyIndex++; restoreFromHistory(); }
function updateUndoRedoUI(){
  $('undoBtn').classList.toggle('disabled', historyIndex <= 0);
  $('redoBtn').classList.toggle('disabled', historyIndex >= history.length - 1);
}

function clearCanvas(saveHistory = true){
  if (saveHistory) pushHistory();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  updateUndoRedoUI();
}

function getPos(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}
function activeColor(){ return isEraser ? '#ffffff' : currentColor; }

canvas.addEventListener('pointerdown', e=>{
  if (!gameActive) return;
  e.preventDefault();
  if (isBucket){
    pushHistory();
    const p = getPos(e);
    floodFill(p.x, p.y, currentColor);
    return;
  }
  pushHistory();
  drawing = true;
  canvas.setPointerCapture(e.pointerId);
  const p = getPos(e);
  lastPt = p;
  ctx.beginPath();
  ctx.arc(p.x, p.y, brushSize/2, 0, Math.PI*2);
  ctx.fillStyle = activeColor();
  ctx.fill();
});

canvas.addEventListener('pointermove', e=>{
  if (!drawing || !gameActive) return;
  e.preventDefault();
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastPt.x, lastPt.y);
  ctx.lineTo(p.x, p.y);
  ctx.strokeStyle = activeColor();
  ctx.lineWidth = brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  lastPt = p;
});

['pointerup','pointercancel','pointerleave'].forEach(ev =>
  canvas.addEventListener(ev, ()=>{ drawing=false; lastPt=null; })
);

document.querySelectorAll('.tool[data-size]').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tool[data-size]').forEach(x=>x.classList.remove('sel'));
    t.classList.add('sel');
    brushSize = parseInt(t.dataset.size);
  });
});

document.querySelectorAll('.color[data-color]').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel');
    currentColor = c.dataset.color;
    isEraser = false;
    $('eraserBtn').classList.remove('sel');
    if (isBucket){
      isBucket = false;
      $('bucketBtn').classList.remove('sel');
      canvas.classList.remove('bucket-mode');
    }
  });
});

$('customColorInput').addEventListener('input', e=>{
  currentColor = e.target.value;
  document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));
  $('customColorBtn').classList.add('sel');
  $('customColorBtn').style.background = currentColor;
  isEraser = false;
  $('eraserBtn').classList.remove('sel');
  if (isBucket){
    isBucket = false;
    $('bucketBtn').classList.remove('sel');
    canvas.classList.remove('bucket-mode');
  }
});

function toggleEraser(){
  isEraser = !isEraser;
  $('eraserBtn').classList.toggle('sel', isEraser);
  isBucket = false;
  $('bucketBtn').classList.remove('sel');
  canvas.classList.remove('bucket-mode');
  if (isEraser){
    document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));
  } else {
    document.querySelectorAll('.color').forEach(x=>{
      if (x.dataset.color === currentColor) x.classList.add('sel');
    });
  }
}

function toggleBucket(){
  isBucket = !isBucket;
  $('bucketBtn').classList.toggle('sel', isBucket);
  canvas.classList.toggle('bucket-mode', isBucket);
  isEraser = false;
  $('eraserBtn').classList.remove('sel');
  if (isBucket){
    document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));
  } else {
    document.querySelectorAll('.color').forEach(x=>{
      if (x.dataset.color === currentColor) x.classList.add('sel');
    });
  }
}

document.addEventListener('keydown', e => {
  if (!gameActive) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){
    e.preventDefault(); redo();
  }
});

/* ================== FLOOD FILL ================== */
function floodFill(startX, startY, fillColor){
  const w = canvas.width, h = canvas.height;
  const sx = Math.floor(startX), sy = Math.floor(startY);
  if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;

  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const startIdx = (sy * w + sx) * 4;
  const targetR = data[startIdx], targetG = data[startIdx+1];
  const targetB = data[startIdx+2], targetA = data[startIdx+3];

  const fr = parseInt(fillColor.slice(1,3), 16);
  const fg = parseInt(fillColor.slice(3,5), 16);
  const fb = parseInt(fillColor.slice(5,7), 16);

  if (Math.abs(targetR-fr) < 8 && Math.abs(targetG-fg) < 8 &&
      Math.abs(targetB-fb) < 8 && targetA === 255) return;

  const tol = 60;
  function matches(i){
    const dr = data[i]-targetR, dg = data[i+1]-targetG;
    const db = data[i+2]-targetB, da = data[i+3]-targetA;
    return (Math.abs(dr)+Math.abs(dg)+Math.abs(db)+Math.abs(da)) <= tol;
  }

  const stack = [[sx, sy]];
  while (stack.length){
    const [x0, y0] = stack.pop();
    if (y0 < 0 || y0 >= h) continue;
    const rowStart = y0 * w;
    let xL = x0;
    while (xL >= 0 && matches((rowStart + xL) * 4)) xL--;
    xL++;
    let xR = x0;
    while (xR < w && matches((rowStart + xR) * 4)) xR++;
    xR--;
    if (xL > xR) continue;

    for (let x = xL; x <= xR; x++){
      const pi = (rowStart + x) * 4;
      data[pi]=fr; data[pi+1]=fg; data[pi+2]=fb; data[pi+3]=255;
    }
    if (y0 > 0){
      const upStart = (y0 - 1) * w;
      let inSpan = false;
      for (let x = xL; x <= xR; x++){
        const m = matches((upStart + x) * 4);
        if (m && !inSpan){ stack.push([x, y0-1]); inSpan = true; }
        else if (!m) inSpan = false;
      }
    }
    if (y0 < h - 1){
      const dnStart = (y0 + 1) * w;
      let inSpan = false;
      for (let x = xL; x <= xR; x++){
        const m = matches((dnStart + x) * 4);
        if (m && !inSpan){ stack.push([x, y0+1]); inSpan = true; }
        else if (!m) inSpan = false;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

/* ================== KONVERSI GAMBAR ================== */
function canvasToThumb(canvasEl, maxSize){
  const scale = Math.min(1, maxSize / canvasEl.width);
  const w = Math.round(canvasEl.width * scale);
  const h = Math.round(canvasEl.height * scale);
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tc = tmp.getContext('2d', {willReadFrequently:true});
  tc.fillStyle = '#ffffff';
  tc.fillRect(0, 0, w, h);
  tc.drawImage(canvasEl, 0, 0, w, h);
  return tmp.toDataURL('image/jpeg', 0.6);
}

function copyCode(){
  navigator.clipboard?.writeText(roomCode).then(
    ()=>setStatus('lobbyStatus','Kode disalin! ✅'),
    ()=>setStatus('lobbyStatus','Kode: '+roomCode)
  );
}

/* ================== PERBANDINGAN GAMBAR ================== */
function toGrid(canvasEl){
  const tmp = document.createElement('canvas');
  tmp.width = GRID; tmp.height = GRID;
  const tc = tmp.getContext('2d', {willReadFrequently:true});
  tc.fillStyle = '#fff';
  tc.fillRect(0,0,GRID,GRID);
  tc.drawImage(canvasEl, 0, 0, GRID, GRID);
  const d = tc.getImageData(0,0,GRID,GRID).data;
  const arr = new Uint8Array(GRID*GRID);
  for (let i=0, j=0; i<d.length; i+=4, j++){
    const dist = Math.abs(255-d[i]) + Math.abs(255-d[i+1]) + Math.abs(255-d[i+2]);
    arr[j] = dist > 100 ? 1 : 0;
  }
  return arr;
}

function packGrid(arr){ return Array.from(arr).join(''); }
function unpackGrid(str){
  const a = new Uint8Array(str.length);
  for (let i=0;i<str.length;i++) a[i] = str.charCodeAt(i)===49 ? 1 : 0;
  return a;
}

function dilate(arr, r){
  const out = new Uint8Array(arr.length);
  for (let y=0; y<GRID; y++){
    for (let x=0; x<GRID; x++){
      let v = 0;
      for (let dy=-r; dy<=r && !v; dy++){
        const ny = y+dy;
        if (ny<0 || ny>=GRID) continue;
        for (let dx=-r; dx<=r; dx++){
          const nx = x+dx;
          if (nx<0 || nx>=GRID) continue;
          if (arr[ny*GRID + nx]){ v=1; break; }
        }
      }
      out[y*GRID + x] = v;
    }
  }
  return out;
}

function similarity(a, b){
  let ra = 0, rb = 0;
  for (let i = 0; i < a.length; i++){
    if (a[i]) ra++;
    if (b[i]) rb++;
  }
  const minPixels = Math.floor(GRID * GRID * 0.01);
  if (ra < minPixels || rb < minPixels) return 0;

  const da = dilate(a, DILATE_R);
  const db = dilate(b, DILATE_R);
  let areaA = 0, areaB = 0, inter = 0;
  for (let i = 0; i < a.length; i++){
    const A = da[i], B = db[i];
    if (A) areaA++;
    if (B) areaB++;
    if (A && B) inter++;
  }
  if (areaA === 0 || areaB === 0) return 0;

  const p = inter / areaA;
  const r = inter / areaB;
  if (p + r === 0) return 0;
  const f1 = 2 * p * r / (p + r);
  const sizeRatio = Math.min(areaA, areaB) / Math.max(areaA, areaB);
  const score = f1 * (0.85 + 0.15 * sizeRatio);
  return Math.round(score * 100);
}
